[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion-core"
version = "0.0.1"
description = "Rigid-body dynamics and torque-limited motion profile optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The whole point of this package: it stays light enough to be a dependency.
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
# JIT-accelerated dynamics. A pure-numpy path exists and is checked for parity.
fast = ["numba>=0.59"]
# URDF-defined serial robots.
robot = ["yourdfpy>=0.0.56"]
# Independent cross-check of the inverse dynamics (V3.5). Test-only.
validation = ["mujoco>=3.1"]
# Larger NLPs with analytic derivatives, once SLSQP runs out.
opt = ["casadi>=3.6"]
bench = ["matplotlib>=3.8", "pyyaml>=6.0", "jupyter"]
dev = ["pytest>=8", "ruff>=0.5", "motion-core[fast,robot,validation,bench]"]

# dev extra 를 `uv sync` 의 기본 집합으로 들인다. extras 는 기본이 아니라서, 이게
# 없으면 `uv sync` 가 pytest · mujoco · numba · yourdfpy 를 포함해 **131개를 지운다**
# (2026-11-04 --dry-run 실측). 에러가 아니라 조용한 초록이 되는 게 위험하다:
# mujoco 가 빠지면 V3.5 가 skip 으로 바뀌어 "44 passed, 1 skipped" 로 보인다.
# 그룹은 배포 메타데이터에 안 들어가므로 패키지 사용자에게는 아무 변화가 없다.
[dependency-groups]
dev = ["motion-core[dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/motion_core"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
